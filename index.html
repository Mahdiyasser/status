<!doctype html>
<html lang="en" class="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />

<title>Status | Mahdi Yasser</title>

<meta name="title" content="System Status Page | Mahdi Yasser" />
<meta name="description"
    content="Real-time status updates and historical uptime information for all systems and services by Mahdi Yasser." />
<meta name="author" content="Mahdi Yasser" />
<meta name="robots" content="index, follow" />

<meta property="og:type" content="website" />
<meta property="og:url" content="https://status.mahdiyasser.com/" />
<meta property="og:title" content="System Status Page | Mahdi Yasser" />
<meta property="og:description"
    content="Real-time status updates and historical uptime information for all systems and services by Mahdi Yasser." />
<meta property="og:image" content="https://status.mahdiyasser.com/favicon.ico" />
<meta property="og:site_name" content="Mahdi Yasser" />

<meta name="twitter:card" content="summary" />
<meta name="twitter:url" content="https://status.mahdiyasser.com/" />
<meta name="twitter:title" content="System Status Page | Mahdi Yasser" />
<meta name="twitter:description"
    content="Real-time status updates and historical uptime information for all systems and services by Mahdi Yasser." />
<meta name="twitter:image" content="https://status.mahdiyasser.com/favicon.ico" />

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "Mahdi Yasser Status Page",
  "url": "https://status.mahdiyasser.com/",
  "description": "Real-time status updates and historical uptime information for services provided by Mahdi Yasser."
}
</script>

<link rel="icon" href="favicon.ico" />

<link rel="stylesheet" href="style.css" />

<script src="script.js" defer></script>
</head>
<body>
  <!-- The page wash layer applies the ambient color effect from the latest status -->
  <div class="page-wash" id="page-wash" aria-hidden="true"></div>

  <div class="page-wrap" id="app" role="main" aria-live="polite">
    <header>
      <div class="logo"><img src="favicon.ico"></img></div>
      <div>
        <h1 id="page-title">Status Page</h1>
        <div class="sub" id="page-sub">Live system statuses</div>
      </div>

      <div class="controls" role="toolbar" aria-label="controls">
        <!-- Search Input -->
        <div class="control search-control" title="Search statuses">
          <svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" aria-hidden>
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="16.5" y1="16.5" x2="22" y2="22"></line>
          </svg>
          <input id="search" class="search-input" placeholder="Search title, desc, id…" />
        </div>

        <!-- Styled Dropdown for Timezone -->
        <div class="control dropdown-control" title="Timezone Selector">
            <svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" aria-hidden>
                <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z"/>
                <path d="M12 6V12L16 14"/>
            </svg>
            <select id="tz" class="tz-select" aria-label="timezone selector"></select>
        </div>

        <!-- Theme Toggle Button -->
        <button id="themeBtn" class="theme-toggle" title="Toggle theme">
          <span id="themeIcon">🌞</span><span id="themeLabel">Light</span>
        </button>
      </div>
    </header>

    <!-- Overall Status Banner -->
    <div id="banner" class="banner" style="display:none">
      <div class="pill" id="banner-pill">Overall</div>
      <div style="flex:1">
        <div class="overall-title" id="overall-message">All Systems Operational</div>
        <div class="overall-sub" id="overall-sub">Summary — last update: —</div>
      </div>
      <div class="banner-meta">
        <div class="last-updated" id="last-updated">—</div>
        <div class="tz-note" id="tz-note">Times shown in local time</div>
      </div>
    </div>

    <main>
      <div id="error" class="error" style="display:none"></div>
      <div id="cards" class="cards" aria-live="polite"></div>
      <div id="empty" class="empty" style="display:none">No statuses to show — All Systems Operational.</div>
    </main>

    <footer><div id="counts"></div></footer>
  </div>
</body>
</html>
